  <text x="1041" y="350" font-family="Arial" font-size="16" text-anchor="middle" fill="#59636E">a .pptx file</text>
  <text x="108" y="470" font-family="Arial" font-size="22" fill="#1F2328">Edit a slide, run one script, and publish the file.</text>
  <line x1="80" y1="656" x2="1200" y2="656" stroke="#D1D9E0" stroke-width="1"/>
