<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="80" y="76" width="8" height="100" fill="#0F6B4F"/>
  <text x="108" y="98" font-family="Arial" font-size="16" font-weight="700" letter-spacing="3" fill="#17A67A">03 · THE PIPELINE</text>
  <text x="108" y="166" font-family="Georgia" font-size="44" font-weight="700" fill="#1F2328">A deck is edited slide by slide</text>
  <rect x="108" y="250" width="246" height="150" rx="8" fill="#F6F8FA" stroke="#D1D9E0" stroke-width="1"/>
  <text x="231" y="316" font-family="Arial" font-size="24" font-weight="700" text-anchor="middle" fill="#1F2328">Edit</text>
  <text x="231" y="350" font-family="Arial" font-size="16" text-anchor="middle" fill="#59636E">one SVG for each slide</text>
  <rect x="378" y="250" width="246" height="150" rx="8" fill="#F6F8FA" stroke="#D1D9E0" stroke-width="1"/>
  <text x="501" y="316" font-family="Arial" font-size="24" font-weight="700" text-anchor="middle" fill="#1F2328">Check</text>
  <text x="501" y="350" font-family="Arial" font-size="16" text-anchor="middle" fill="#59636E">the quality checker</text>
  <rect x="648" y="250" width="246" height="150" rx="8" fill="#F6F8FA" stroke="#D1D9E0" stroke-width="1"/>
  <text x="771" y="316" font-family="Arial" font-size="24" font-weight="700" text-anchor="middle" fill="#1F2328">Finalize</text>
  <text x="771" y="350" font-family="Arial" font-size="16" text-anchor="middle" fill="#59636E">icons and text</text>
  <rect x="918" y="250" width="246" height="150" rx="8" fill="#F6F8FA" stroke="#D1D9E0" stroke-width="1"/>
