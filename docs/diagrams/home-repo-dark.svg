<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">How a Home Repo works</title>
<desc id="d">Every session starts in the Home Repo, which holds the rules, the shared skills, the record and the checks. The agent follows a pointer to another repo, writes designs and decisions back, and can publish the record as a site.</desc>
<rect x="150" y="20" width="220" height="50" rx="25" fill="#0d1117" stroke="#4493f8" stroke-width="1.5"/>
<text x="260" y="50" text-anchor="middle" font-size="14" font-weight="600" fill="#f0f6fc">You and your agent</text>
<rect x="520" y="20" width="240" height="50" rx="6" fill="#0d1117" stroke="#3d444d"/>
<text x="640.0" y="50.0" text-anchor="middle" font-size="14" font-weight="600" fill="#f0f6fc">Outside sources and meetings</text>
<line x1="260" y1="70" x2="260" y2="123" stroke="#9198a1" stroke-width="1.5"/>
<path d="M255 121 L265 121 L260 130 Z" fill="#9198a1"/>
<text x="272" y="98" font-size="12.5" fill="#f0f6fc">1. Every session</text>
<text x="272" y="115" font-size="12.5" fill="#f0f6fc">starts here</text>
<line x1="640" y1="70" x2="640" y2="123" stroke="#9198a1" stroke-width="1.5"/>
<path d="M635 121 L645 121 L640 130 Z" fill="#9198a1"/>
<text x="652" y="98" font-size="12.5" fill="#f0f6fc">check-out,</text>
<text x="652" y="115" font-size="12.5" fill="#f0f6fc">capture-sync</text>
<rect x="60" y="130" width="840" height="160" rx="8" fill="#151b23" stroke="#4493f8" stroke-width="1.5"/>
<text x="80" y="155" font-size="14" font-weight="700" fill="#4493f8">Home Repo</text>
<rect x="80" y="170" width="185" height="100" rx="6" fill="#0d1117" stroke="#3d444d"/>
<text x="172.5" y="207.0" text-anchor="middle" font-size="14" font-weight="600" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">AGENTS.md</text>
<text x="172.5" y="225.0" text-anchor="middle" font-size="12" fill="#9198a1">rules and</text>
<text x="172.5" y="243.0" text-anchor="middle" font-size="12" fill="#9198a1">Other Repos pointers</text>
<rect x="285" y="170" width="185" height="100" rx="6" fill="#0d1117" stroke="#3d444d"/>
<text x="377.5" y="207.0" text-anchor="middle" font-size="14" font-weight="600" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">.agents/skills</text>
<text x="377.5" y="225.0" text-anchor="middle" font-size="12" fill="#9198a1">the shared</text>
<text x="377.5" y="243.0" text-anchor="middle" font-size="12" fill="#9198a1">method</text>
<rect x="490" y="170" width="185" height="100" rx="6" fill="#0d1117" stroke="#3d444d"/>
<text x="582.5" y="207.0" text-anchor="middle" font-size="14" font-weight="600" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">docs/</text>
<text x="582.5" y="225.0" text-anchor="middle" font-size="12" fill="#9198a1">decisions, designs,</text>
<text x="582.5" y="243.0" text-anchor="middle" font-size="12" fill="#9198a1">reads, syncs</text>
<rect x="695" y="170" width="185" height="100" rx="6" fill="#0d1117" stroke="#3d444d"/>
<text x="787.5" y="207.0" text-anchor="middle" font-size="14" font-weight="600" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">scripts/ and hooks</text>
<text x="787.5" y="225.0" text-anchor="middle" font-size="12" fill="#9198a1">quote check,</text>
<text x="787.5" y="243.0" text-anchor="middle" font-size="12" fill="#9198a1">credential scan</text>
<line x1="200" y1="290" x2="200" y2="383" stroke="#9198a1" stroke-width="1.5"/>
<path d="M195 381 L205 381 L200 390 Z" fill="#9198a1"/>
<text x="212" y="335" font-size="12.5" fill="#f0f6fc">2. Follow a pointer:</text>
<text x="212" y="352" font-size="12.5" fill="#f0f6fc">path, remote, hint</text>
<line x1="540" y1="390" x2="540" y2="297" stroke="#9198a1" stroke-width="1.5" stroke-dasharray="5 4"/>
<path d="M535 299 L545 299 L540 290 Z" fill="#9198a1"/>
<text x="552" y="335" font-size="12.5" fill="#f0f6fc">3. Designs and decisions</text>
<text x="552" y="352" font-size="12.5" fill="#f0f6fc">are written back</text>
<line x1="800" y1="290" x2="800" y2="403" stroke="#9198a1" stroke-width="1.5"/>
<path d="M795 401 L805 401 L800 410 Z" fill="#9198a1"/>
<text x="812" y="335" font-size="12.5" fill="#f0f6fc">4. deploy.sh,</text>
<text x="812" y="352" font-size="12.5" fill="#f0f6fc">through its gates</text>
<rect x="60" y="390" width="560" height="150" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
<text x="80" y="415" font-size="14" font-weight="700" fill="#f0f6fc">Your other repos</text>
<rect x="80" y="430" width="160" height="90" rx="6" fill="#0d1117" stroke="#3d444d"/>
<text x="160.0" y="462.0" text-anchor="middle" font-size="14" font-weight="600" fill="#f0f6fc">Product repo</text>
<text x="160.0" y="480.0" text-anchor="middle" font-size="12" fill="#9198a1">code, tests,</text>
<text x="160.0" y="498.0" text-anchor="middle" font-size="12" fill="#9198a1">its own AGENTS.md</text>
<rect x="260" y="430" width="160" height="90" rx="6" fill="#0d1117" stroke="#3d444d"/>
<text x="340.0" y="462.0" text-anchor="middle" font-size="14" font-weight="600" fill="#f0f6fc">Library repo</text>
<text x="340.0" y="480.0" text-anchor="middle" font-size="12" fill="#9198a1">its own rules</text>
<text x="340.0" y="498.0" text-anchor="middle" font-size="12" fill="#9198a1">and history</text>
<rect x="440" y="430" width="160" height="90" rx="6" fill="#0d1117" stroke="#3d444d"/>
<text x="520.0" y="462.0" text-anchor="middle" font-size="14" font-weight="600" fill="#f0f6fc">More repos</text>
<text x="520.0" y="480.0" text-anchor="middle" font-size="12" fill="#9198a1">one pointer</text>
<text x="520.0" y="498.0" text-anchor="middle" font-size="12" fill="#9198a1">for each</text>
<rect x="700" y="410" width="200" height="110" rx="6" fill="#0d1117" stroke="#3d444d"/>
<text x="800.0" y="452.0" text-anchor="middle" font-size="14" font-weight="600" fill="#f0f6fc">Site</text>
<text x="800.0" y="470.0" text-anchor="middle" font-size="12" fill="#9198a1">a Cloudflare Worker,</text>
<text x="800.0" y="488.0" text-anchor="middle" font-size="12" fill="#9198a1">optional</text>
</svg>
